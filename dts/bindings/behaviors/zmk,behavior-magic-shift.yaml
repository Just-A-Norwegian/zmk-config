description: Magic Shift behavior with one-shot Shift, held Shift, and double-tap Caps Lock

compatible: "zmk,behavior-magic-shift"

include: zero_param.yaml

properties:
  bindings:
    type: phandle-array
    required: true
  hold-term-ms:
    type: int
    default: 200
  double-tap-ms:
    type: int
    default: 250
  one-shot-term-ms:
    type: int
    default: 1000
    description: How long one-shot Shift stays active after the double-tap window closes
