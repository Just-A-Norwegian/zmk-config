description: Enter behavior that supports Magic Shift and a held System chord

compatible: "zmk,behavior-system-enter"

include: two_param.yaml

properties:
  bindings:
    type: phandles
    required: true
  system-layer:
    type: phandle
    required: true
  tapping-term-ms:
    type: int
    default: 200
  system-chord-term-ms:
    type: int
    default: 200
  first-non-thumb-position:
    type: int
    default: 40
